<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0a0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>ULTRON Remote</title>
<style>
  :root { --bg: #0b0a0d; --panel: #16141b; --line: rgba(255,255,255,.09); --ink: #efece6; --mute: #8f8b95;
          --a1: #ffc371; --a2: #ff5f8f; --a3: #8b6bff; --spec: linear-gradient(90deg, var(--a1), var(--a2) 55%, var(--a3)); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.4 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
  body { min-height: 100svh; padding: max(env(safe-area-inset-top), 18px) 18px max(env(safe-area-inset-bottom), 22px); overscroll-behavior: none;
         background: radial-gradient(60rem 30rem at 110% -10%, rgba(139,107,255,.18), transparent 60%), radial-gradient(40rem 26rem at -20% 110%, rgba(255,195,113,.12), transparent 60%), var(--bg); background-attachment: fixed; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; touch-action: manipulation; }
  .hidden { display: none !important; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .brand { font-weight: 800; letter-spacing: .22em; font-size: 12px; }
  .brand i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--mute); margin-right: 8px; vertical-align: 1px; transition: background .3s; }
  .brand i.on { background: #4ade80; box-shadow: 0 0 10px #4ade80; }
  .kicker { font-size: 11px; letter-spacing: .2em; color: var(--mute); text-transform: uppercase; }

  /* pairing */
  #pair { text-align: center; padding-top: 12vh; }
  #pair h1 { font-size: 26px; margin: 0 0 6px; }
  #pair p { color: var(--mute); margin: 0 0 26px; }
  #pin { width: 100%; max-width: 280px; font: 700 34px/1 ui-monospace, monospace; letter-spacing: .4em; text-align: center; padding: 16px 0 16px .4em;
         background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 16px; outline: none; }
  #pin:focus { border-color: var(--a1); }
  #pair-go { display: block; margin: 16px auto 0; padding: 14px 40px; border-radius: 999px; background: var(--spec); color: #16110c; font-weight: 800; }
  #pair-err { color: var(--a2); min-height: 1.4em; margin-top: 14px; }

  /* now playing */
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 22px; padding: 20px; position: relative; overflow: hidden; }
  .card::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--spec); opacity: .9; }
  #np-kind { margin-bottom: 8px; }
  #np-title { font-size: 22px; font-weight: 750; line-height: 1.2; margin: 0; word-break: break-word; }
  #np-sub { color: var(--mute); margin-top: 4px; min-height: 1.2em; }
  #bar { position: relative; height: 34px; margin: 18px 0 2px; touch-action: none; }
  #bar .track { position: absolute; left: 0; right: 0; top: 15px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.12); }
  #bar .fill { position: absolute; left: 0; top: 15px; height: 4px; border-radius: 4px; background: var(--spec); width: 0; }
  #bar .knob { position: absolute; top: 9px; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.6); left: 0; }
  .times { display: flex; justify-content: space-between; font: 12px ui-monospace, monospace; color: var(--mute); }

  .ctrls { display: grid; grid-template-columns: 1fr 1fr 1.5fr 1fr 1fr; align-items: center; justify-items: center; margin: 22px 0 8px; }
  .ctrls button { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; transition: transform .12s, background .2s; }
  .ctrls button:active { transform: scale(.9); background: rgba(255,255,255,.08); }
  .ctrls button[disabled] { opacity: .25; }
  .ctrls .big { width: 78px; height: 78px; background: var(--spec); color: #16110c; box-shadow: 0 12px 30px -10px rgba(255,95,143,.7); }
  .ctrls .big:active { background: var(--spec); }
  svg { width: 26px; height: 26px; fill: currentColor; }
  .big svg { width: 34px; height: 34px; }
  .seek10 { position: relative; }
  .seek10 small { position: absolute; font: 700 9px system-ui; top: 50%; left: 50%; transform: translate(-50%, -38%); }

  .vol { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
  .vol button { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%; }
  .vol svg { width: 22px; height: 22px; }
  input[type=range] { -webkit-appearance: none; appearance: none; flex: 1; height: 34px; background: transparent; }
  input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 4px; background: linear-gradient(90deg, var(--a1) var(--p,50%), rgba(255,255,255,.12) var(--p,50%)); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; margin-top: -8px; border-radius: 50%; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.5); }
  input[type=range]::-moz-range-track { height: 4px; border-radius: 4px; background: rgba(255,255,255,.12); }
  input[type=range]::-moz-range-progress { height: 4px; border-radius: 4px; background: var(--a1); }
  input[type=range]::-moz-range-thumb { width: 20px; height: 20px; border: 0; border-radius: 50%; background: #fff; }

  .row { display: flex; gap: 10px; margin-top: 16px; }
  .pill { flex: 1; padding: 13px 10px; border-radius: 14px; background: rgba(255,255,255,.05); border: 1px solid var(--line); font-weight: 650; font-size: 14px;
          display: flex; align-items: center; justify-content: center; gap: 8px; }
  .pill:active { background: rgba(255,255,255,.1); }
  .pill svg { width: 18px; height: 18px; }

  #idle { text-align: center; padding: 26px 10px 6px; color: var(--mute); }
  #idle b { display: block; color: var(--ink); font-size: 18px; margin-bottom: 4px; }

  h2 { font-size: 13px; letter-spacing: .2em; text-transform: uppercase; color: var(--mute); margin: 30px 2px 12px; font-weight: 700; }
  #cw { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .tile { text-align: left; border-radius: 16px; overflow: hidden; background: var(--panel); border: 1px solid var(--line); transition: transform .12s; }
  .tile:active { transform: scale(.97); }
  .tile .pic { aspect-ratio: 16 / 10; background: linear-gradient(135deg, #2a2233, #17151c); position: relative; }
  .tile .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tile .pic .prog { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--spec); }
  .tile .pic .play { position: absolute; right: 8px; bottom: 9px; width: 30px; height: 30px; border-radius: 50%; background: rgba(0,0,0,.6); display: grid; place-items: center; }
  .tile .pic .play svg { width: 14px; height: 14px; }
  .tile .meta { padding: 9px 11px 11px; }
  .tile .t { font-weight: 700; font-size: 13.5px; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .tile .s { color: var(--mute); font-size: 12px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #cw-empty { color: var(--mute); font-size: 14px; }
  #toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 24px); transform: translate(-50%, 20px); opacity: 0; background: #24212b; border: 1px solid var(--line);
           padding: 10px 18px; border-radius: 999px; font-weight: 600; font-size: 14px; transition: .25s; pointer-events: none; white-space: nowrap; }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<header><div class="brand"><i id="dot"></i>ULTRON REMOTE</div><div class="kicker" id="hdr-kind"></div></header>

<section id="pair" class="hidden">
  <h1>Pair this phone</h1>
  <p>Enter the 6-digit code shown in<br>Settings › Phone remote on your PC.</p>
  <input id="pin" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]*" placeholder="······">
  <button id="pair-go">Pair</button>
  <div id="pair-err"></div>
</section>

<section id="remote" class="hidden">
  <div class="card">
    <div id="np-kind" class="kicker">Nothing playing</div>
    <h1 id="np-title">Ready when you are</h1>
    <div id="np-sub"></div>
    <div id="np-body">
      <div id="bar"><div class="track"></div><div class="fill"></div><div class="knob"></div></div>
      <div class="times"><span id="t-cur">0:00</span><span id="t-dur">0:00</span></div>
      <div class="ctrls">
        <button id="b-prev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
        <button id="b-back" class="seek10" aria-label="Back 10 seconds"><svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></svg><small>10</small></button>
        <button id="b-play" class="big" aria-label="Play or pause"><svg viewBox="0 0 24 24" id="i-play"><path d="M8 5v14l11-7z"/></svg></button>
        <button id="b-fwd" class="seek10" aria-label="Forward 10 seconds"><svg viewBox="0 0 24 24"><path d="M12 5V2l5 4-5 4V7a6 6 0 1 0 6 6h2a8 8 0 1 1-8-8z"/></svg><small>10</small></button>
        <button id="b-next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
      </div>
      <div class="vol">
        <button id="b-mute" aria-label="Mute"><svg viewBox="0 0 24 24" id="i-vol"><path d="M4 9v6h4l5 5V4L8 9zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg></button>
        <input id="vol" type="range" min="0" max="100" value="80" aria-label="Volume">
      </div>
    </div>
    <div id="idle" class="hidden"><b>Nothing is playing</b>Pick something below, or shuffle your music.</div>
  </div>
  <div class="row">
    <button class="pill" id="b-shuffle"><svg viewBox="0 0 24 24"><path d="M17 3l4 4-4 4V8h-2.6l-3 3.5-1.4-1.6L13.4 6H17zM3 6h4.6l9 11H17v-3l4 4-4 4v-3h-1.4l-9-11H3zm0 12h3.6l2.2-2.6 1.4 1.6L7.4 20H3z"/></svg>Shuffle music</button>
    <button class="pill" id="b-close"><svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>Stop video</button>
  </div>
  <h2>Continue watching</h2>
  <div id="cw"></div>
  <div id="cw-empty" class="hidden">Videos you stop part-way show up here.</div>
</section>
<div id="toast"></div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var ICON_PLAY = '<path d="M8 5v14l11-7z"/>', ICON_PAUSE = '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';
  var ICON_VOL = '<path d="M4 9v6h4l5 5V4L8 9zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/>';
  var ICON_MUTE = '<path d="M4 9v6h4l5 5V4L8 9zm16.6 3 2.1-2.1-1.4-1.4-2.1 2.1-2.1-2.1-1.4 1.4 2.1 2.1-2.1 2.1 1.4 1.4 2.1-2.1 2.1 2.1 1.4-1.4z"/>';
  var now = { kind: 'none' }, dragging = false, volTouch = 0, pollT = null, libAt = 0;

  function buzz() { try { navigator.vibrate && navigator.vibrate(12); } catch (e) {} }
  function toast(t) { var el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(function () { el.classList.remove('on'); }, 1600); }
  function fmt(s) { s = Math.max(0, Math.floor(s || 0)); var h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, x = s % 60;
    return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0'); }
  function left(s) { var m = Math.round(s / 60); return m >= 60 ? Math.floor(m / 60) + ' h ' + (m % 60) + ' min left' : m + ' min left'; }

  function req(method, path, body) {
    var o = { method: method, credentials: 'same-origin', headers: {} };
    if (body !== undefined) { o.headers['Content-Type'] = 'application/json'; o.headers['X-Remote'] = '1'; o.body = JSON.stringify(body); }
    return fetch(path, o);
  }
  function cmd(c, arg) {
    buzz();
    return req('POST', '/cmd', { cmd: c, arg: arg }).then(function (r) {
      if (r.status === 401) showPair(); else setTimeout(poll, 250);
    }).catch(function () { toast('PC not reachable'); });
  }

  // ---- pairing
  function showPair() { clearTimeout(pollT); $('remote').classList.add('hidden'); $('pair').classList.remove('hidden'); $('dot').classList.remove('on'); }
  function pair(pin) {
    $('pair-err').textContent = '';
    return req('POST', '/pair', { pin: pin }).then(function (r) {
      return r.json().then(function (d) {
        if (r.ok) { history.replaceState(null, '', location.pathname); start(); }
        else { $('pair-err').textContent = d.error || 'Could not pair'; $('pin').value = ''; }
      });
    }).catch(function () { $('pair-err').textContent = 'PC not reachable'; });
  }
  $('pair-go').onclick = function () { pair($('pin').value.trim()); };
  $('pin').addEventListener('input', function () { if (/^\d{6}$/.test(this.value)) pair(this.value); });

  // ---- now playing
  function paint() {
    var on = now.kind && now.kind !== 'none';
    $('np-body').classList.toggle('hidden', !on);
    $('idle').classList.toggle('hidden', on);
    $('np-kind').textContent = !on ? 'Nothing playing' : now.kind === 'music' ? 'Now playing · Music' : now.private ? 'Now playing · Private' : 'Now playing · Video';
    $('hdr-kind').textContent = on ? (now.paused ? 'Paused' : 'Playing') : '';
    $('np-title').textContent = on ? (now.title || 'Untitled') : 'Ready when you are';
    $('np-sub').textContent = on ? (now.sub || '') : '';
    $('i-play').innerHTML = on && !now.paused ? ICON_PAUSE : ICON_PLAY;
    $('i-vol').innerHTML = now.muted || now.vol === 0 ? ICON_MUTE : ICON_VOL;
    $('b-next').disabled = now.kind === 'video' && !now.has_next;     // music always has a next; prev restarts a song or video
    $('b-close').classList.toggle('hidden', now.kind !== 'video');
    if (!dragging) setBar(now.dur ? now.pos / now.dur : 0, now.pos);
    $('t-dur').textContent = fmt(now.dur);
    if (Date.now() - volTouch > 2500 && typeof now.vol === 'number') { $('vol').value = Math.round(now.vol * 100); paintVol(); }
  }
  function setBar(f, t) {
    f = Math.max(0, Math.min(1, f || 0));
    document.querySelector('#bar .fill').style.width = (f * 100) + '%';
    document.querySelector('#bar .knob').style.left = (f * 100) + '%';
    $('t-cur').textContent = fmt(t);
  }
  function poll() {
    clearTimeout(pollT);
    return req('GET', '/state').then(function (r) {
      if (r.status === 401) { showPair(); return; }
      return r.json().then(function (d) {
        $('dot').classList.add('on');
        now = d.now || { kind: 'none' }; paint();
        if (Date.now() - libAt > 20000) loadLib();
        pollT = setTimeout(poll, document.hidden ? 5000 : 1000);
      });
    }).catch(function () { $('dot').classList.remove('on'); pollT = setTimeout(poll, 3000); });
  }
  function loadLib() {
    libAt = Date.now();
    req('GET', '/library').then(function (r) { return r.ok ? r.json() : { continue: [] }; }).then(function (d) {
      var box = $('cw'), list = d.continue || [];
      box.innerHTML = '';
      $('cw-empty').classList.toggle('hidden', list.length > 0);
      list.forEach(function (v) {
        var b = document.createElement('button'); b.className = 'tile';
        b.innerHTML = '<div class="pic"><img alt="" loading="lazy"><div class="prog"></div><div class="play"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div></div><div class="meta"><div class="t"></div><div class="s"></div></div>';
        var img = b.querySelector('img'); img.src = '/poster/' + encodeURIComponent(v.id); img.onerror = function () { img.remove(); };
        b.querySelector('.prog').style.width = Math.round((v.progress || 0) * 100) + '%';
        b.querySelector('.t').textContent = v.title;
        b.querySelector('.s').textContent = (v.sub ? v.sub + ' · ' : '') + left(v.left || 0);
        b.onclick = function () { cmd('play_video', v.id); toast('Starting ' + v.title); };
        box.appendChild(b);
      });
    }).catch(function () {});
  }

  // ---- controls
  $('b-play').onclick = function () { now.paused = !now.paused; paint(); cmd('toggle'); };
  $('b-back').onclick = function () { cmd('seek_rel', -10); };
  $('b-fwd').onclick = function () { cmd('seek_rel', 10); };
  $('b-next').onclick = function () { cmd('next'); };
  $('b-prev').onclick = function () { cmd('prev'); };
  $('b-mute').onclick = function () { now.muted = !now.muted; paint(); cmd('mute'); };
  $('b-shuffle').onclick = function () { cmd('shuffle_music'); toast('Shuffling your music'); };
  $('b-close').onclick = function () { cmd('close'); toast('Stopped'); };
  function paintVol() { $('vol').style.setProperty('--p', $('vol').value + '%'); }
  var volT = null;
  $('vol').addEventListener('input', function () {
    volTouch = Date.now(); paintVol();
    var v = this.value / 100; clearTimeout(volT); volT = setTimeout(function () { req('POST', '/cmd', { cmd: 'vol', arg: v }); }, 60);
  });

  var bar = $('bar');
  function frac(e) { var r = bar.getBoundingClientRect(); return Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)); }
  bar.addEventListener('pointerdown', function (e) { if (!now.dur) return; dragging = true; bar.setPointerCapture(e.pointerId); setBar(frac(e), frac(e) * now.dur); });
  bar.addEventListener('pointermove', function (e) { if (dragging) setBar(frac(e), frac(e) * now.dur); });
  bar.addEventListener('pointerup', function (e) { if (!dragging) return; dragging = false; var f = frac(e); now.pos = f * now.dur; cmd('seek_abs', now.pos); });
  bar.addEventListener('pointercancel', function () { dragging = false; });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) poll(); });

  function start() { $('pair').classList.add('hidden'); $('remote').classList.remove('hidden'); poll(); }

  var m = /pin=(\d{6})/.exec(location.hash || '');
  req('GET', '/state').then(function (r) {
    if (r.ok) { history.replaceState(null, '', location.pathname); start(); }
    else if (m) pair(m[1]);
    else showPair();
  }).catch(function () { showPair(); $('pair-err').textContent = 'PC not reachable'; });
})();
</script>
</body>
</html>
