<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- no viewport-fit=cover: the browser keeps the page (and fullscreen video) clear of camera cutouts by itself -->
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b0a0d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ULTRON">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-180.png">
<title>ULTRON Remote</title>
<style>
  :root { --bg: #0b0a0d; --s1: #17161b; --s2: #222027; --line: rgba(255,255,255,.07); --ink: #f2f0eb; --mute: #8f8b97; --dim: #55515d;
          --acc: #ffc371; --grad: linear-gradient(135deg, #ffc371, #ff5f8f 55%, #8b6bff); --tab-h: 62px; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  body { min-height: 100svh; overscroll-behavior-y: contain; -webkit-user-select: none; user-select: none; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
  input { font: inherit; }
  img { display: block; }
  img.broken { visibility: hidden; }
  .hidden { display: none !important; }
  svg { width: 24px; height: 24px; fill: currentColor; flex: none; }
  .muted { color: var(--mute); }

  /* ---------- frame ---------- */
  header { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 4px; padding: 12px 12px 8px 18px; background: linear-gradient(var(--bg) 70%, rgba(11,10,13,0)); }
  .brand { flex: 1; display: flex; align-items: center; gap: 9px; font-weight: 800; font-size: 15px; letter-spacing: .06em; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); transition: background .3s; }
  .dot.on { background: #4ade80; }
  .hbtn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--mute); }
  .hbtn svg { width: 21px; height: 21px; }
  .in-app #b-appfs { display: none; }
  #offline { margin: 0 16px 10px; padding: 10px 14px; border-radius: 12px; background: rgba(255,95,143,.1); color: #ff9dbb; font-size: 13.5px; }
  main { padding: 0 16px calc(var(--tab-h) + 28px); }
  .view { animation: fade .2s ease; }
  @keyframes fade { from { opacity: 0; } }
  h2 { font-size: 17px; font-weight: 650; margin: 28px 0 12px; }
  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: grid; grid-template-columns: repeat(4, 1fr); height: var(--tab-h);
             background: rgba(14,13,17,.94); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-top: 1px solid var(--line); }
  nav.tabs button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--dim); font-size: 11px; font-weight: 600; }
  nav.tabs button svg { width: 23px; height: 23px; }
  nav.tabs button.on { color: var(--ink); }

  /* ---------- pairing ---------- */
  #pair { text-align: center; padding: 14vh 24px 0; }
  #pair h1 { font-size: 26px; margin: 0 0 8px; }
  #pair p { color: var(--mute); margin: 0 0 28px; }
  #pin { width: 100%; max-width: 280px; font: 700 32px/1 ui-monospace, monospace; letter-spacing: .35em; text-align: center; padding: 16px 0 16px .35em;
         background: var(--s1); color: var(--ink); border: 1px solid var(--line); border-radius: 16px; outline: none; }
  #pin:focus { border-color: var(--acc); }
  #pair-err { color: #ff9dbb; min-height: 1.4em; margin-top: 16px; }

  /* ---------- buttons ---------- */
  .btn { height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 650; font-size: 14.5px; background: var(--s1); padding: 0 14px; }
  .btn svg { width: 19px; height: 19px; }
  .btn.primary { background: var(--ink); color: #121014; }
  .btn.wide { width: 100%; margin-top: 10px; }
  .btn:active, .tool:active i, .qcard:active { transform: scale(.97); }
  .duo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .round { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: rgba(0,0,0,.5); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .round svg { width: 21px; height: 21px; }

  /* ---------- now ---------- */
  .np-hero { position: relative; border-radius: 18px; overflow: hidden; background: var(--s1); aspect-ratio: 16/9; box-shadow: 0 20px 40px -24px #000; }
  .np-hero.sq { aspect-ratio: 1; width: min(76vw, 340px); margin: 6px auto 0; }
  .np-hero img { width: 100%; height: 100%; object-fit: cover; }
  .np-hero .lock { position: absolute; inset: 0; display: grid; place-items: center; color: var(--dim); }
  .np-hero .lock svg { width: 46px; height: 46px; }
  .np-meta { margin: 18px 2px 0; }
  #np-title { font-size: 21px; font-weight: 700; line-height: 1.25; word-break: break-word; }
  #np-sub { color: var(--mute); font-size: 14px; margin-top: 3px; }
  .bar { position: relative; height: 34px; margin-top: 10px; touch-action: none; }
  .bar .track { position: absolute; left: 0; right: 0; top: 15px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.12); }
  .bar .fill { position: absolute; left: 0; top: 15px; height: 4px; border-radius: 4px; background: var(--ink); width: 0; }
  .bar .knob { position: absolute; top: 10px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: #fff; left: 0; transition: transform .15s; }
  .bar.drag .knob { transform: scale(1.4); }
  .bar .ticks i { position: absolute; top: 14px; width: 2px; height: 6px; background: rgba(255,255,255,.35); }
  .preview { position: absolute; bottom: 40px; width: 150px; margin-left: -75px; border-radius: 10px; overflow: hidden; background: #000 no-repeat; box-shadow: 0 10px 30px rgba(0,0,0,.7); pointer-events: none; }
  .preview b { position: absolute; left: 0; right: 0; bottom: 0; font: 700 12px ui-monospace, monospace; text-align: center; padding: 3px; background: rgba(0,0,0,.65); }
  .times { display: flex; justify-content: space-between; font: 12px ui-monospace, monospace; color: var(--mute); margin-top: -4px; }
  .ctrls { display: flex; align-items: center; justify-content: space-between; margin: 12px 4px 4px; }
  .ctrls button { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; }
  .ctrls button:active { background: rgba(255,255,255,.07); }
  .ctrls button[disabled] { opacity: .25; }
  .ctrls .big { width: 72px; height: 72px; background: var(--grad); color: #16110c; }
  .ctrls .big svg { width: 32px; height: 32px; }
  .seek10 { position: relative; }
  .seek10 small { position: absolute; font: 700 9px system-ui; top: 50%; left: 50%; transform: translate(-50%, -38%); }
  .vol { display: flex; align-items: center; gap: 12px; margin-top: 4px; }
  .vol button { width: 36px; height: 36px; display: grid; place-items: center; color: var(--mute); }
  .vol svg { width: 21px; height: 21px; }
  input[type=range] { -webkit-appearance: none; appearance: none; flex: 1; height: 32px; background: transparent; }
  input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 4px; background: linear-gradient(90deg, var(--mute) var(--p,50%), rgba(255,255,255,.12) var(--p,50%)); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; margin-top: -7px; border-radius: 50%; background: #fff; }
  .tools { display: grid; margin-top: 22px; }
  .tool { display: flex; flex-direction: column; align-items: center; gap: 7px; font-size: 11.5px; font-weight: 600; color: var(--mute); }
  .tool i { width: 48px; height: 48px; border-radius: 50%; background: var(--s1); display: grid; place-items: center; color: var(--ink); transition: background .2s; }
  .tool i svg { width: 21px; height: 21px; }
  .tool.on { color: var(--acc); }
  .tool.on i { background: rgba(255,195,113,.15); color: var(--acc); }
  .earbar { display: flex; align-items: center; gap: 10px; margin-top: 18px; padding: 11px 12px 11px 14px; border-radius: 14px; background: rgba(255,195,113,.09); color: var(--acc); font-size: 13.5px; font-weight: 600; }
  .earbar svg { width: 19px; height: 19px; }
  .earbar span { flex: 1; min-width: 0; }
  .earbar button { padding: 7px 12px; border-radius: 999px; background: rgba(255,255,255,.08); color: var(--ink); font-size: 12.5px; font-weight: 650; }

  /* idle */
  .note { color: var(--mute); font-size: 14px; margin: 2px 2px 14px; }
  .hcard { position: relative; display: block; width: 100%; text-align: left; border-radius: 18px; overflow: hidden; aspect-ratio: 16/9; background: var(--s1); }
  .hcard img { width: 100%; height: 100%; object-fit: cover; }
  .hcard::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 35%, rgba(0,0,0,.85)); }
  .hcard .in { position: absolute; left: 16px; right: 16px; bottom: 14px; z-index: 1; }
  .hcard .in b { display: block; font-size: 19px; line-height: 1.2; }
  .hcard .in span { font-size: 13px; color: rgba(255,255,255,.7); }
  .pr { height: 3px; background: rgba(255,255,255,.2); border-radius: 3px; margin-top: 10px; overflow: hidden; }
  .pr i { display: block; height: 100%; background: var(--acc); }
  .qcard { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 16px; background: var(--s1); text-align: left; }
  .qcard .ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; flex: none; background: var(--s2); color: var(--acc); }
  .qcard .ic svg { width: 21px; height: 21px; }
  .qcard b { display: block; font-size: 14.5px; }
  .qcard span { font-size: 12.5px; color: var(--mute); }

  /* ---------- rows, grids, lists ---------- */
  .hrow { display: flex; gap: 12px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px 4px; scroll-snap-type: x mandatory; }
  .hrow::-webkit-scrollbar { display: none; }
  .hrow > * { flex: none; scroll-snap-align: start; }
  .card16 { width: min(62vw, 250px); text-align: left; }
  .card16 .pic { aspect-ratio: 16/9; border-radius: 12px; overflow: hidden; background: var(--s1); position: relative; }
  .pic img { width: 100%; height: 100%; object-fit: cover; }
  .pic .prog { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--acc); }
  .card16 .t, .tile .t { font-weight: 600; font-size: 13px; line-height: 1.3; margin-top: 7px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card16 .s, .tile .s { color: var(--mute); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px 10px; }
  .tile { text-align: left; min-width: 0; }
  .tile .pic { aspect-ratio: 2/3; border-radius: 10px; overflow: hidden; background: var(--s1); position: relative; }
  .tile.sq .pic { aspect-ratio: 1; }
  .list { display: flex; flex-direction: column; }
  .li { display: flex; align-items: center; gap: 12px; padding: 8px 0; width: 100%; text-align: left; }
  .li .art { width: 48px; height: 48px; border-radius: 8px; overflow: hidden; background: var(--s1); flex: none; }
  .li .art img { width: 100%; height: 100%; object-fit: cover; }
  .li .art.w { width: 92px; height: 52px; }
  .li .m { min-width: 0; flex: 1; text-align: left; }
  .li .t { font-weight: 600; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .li .s { color: var(--mute); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .li.now .t { color: var(--acc); }
  .li .act { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--mute); flex: none; }
  .li .act.on { color: #ff6f9a; }
  .li .act svg { width: 20px; height: 20px; }
  .empty { color: var(--mute); padding: 18px 2px; font-size: 14px; }
  .bar2 { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 16px; }
  .seg { display: inline-flex; background: var(--s1); border-radius: 12px; padding: 3px; }
  .seg button { padding: 8px 16px; border-radius: 9px; font-weight: 600; font-size: 14px; color: var(--mute); white-space: nowrap; }
  .seg button.on { background: var(--s2); color: var(--ink); }
  .sortb { display: flex; align-items: center; gap: 4px; color: var(--mute); font-size: 13.5px; font-weight: 600; }
  .sortb svg { width: 18px; height: 18px; }
  .search { display: flex; align-items: center; gap: 10px; background: var(--s1); border-radius: 14px; padding: 0 14px; }
  .search input { flex: 1; background: none; border: 0; outline: none; color: var(--ink); padding: 14px 0; font-size: 16px; -webkit-user-select: text; user-select: text; }
  .search svg { width: 20px; height: 20px; color: var(--mute); }

  /* ---------- pages + sheets ---------- */
  .page { position: fixed; inset: 0; z-index: 40; background: var(--bg); overflow-y: auto; animation: slide .22s ease; padding-bottom: 40px; }
  @keyframes slide { from { transform: translateX(24px); opacity: 0; } }
  .page .back { position: fixed; left: 14px; top: 14px; z-index: 2; }
  .p-hero { position: relative; aspect-ratio: 16/10; background: var(--s1); }
  .p-hero img { width: 100%; height: 100%; object-fit: cover; }
  .p-hero.sq { aspect-ratio: 1; max-height: 52svh; }
  .p-hero::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 45%, var(--bg)); }
  .p-body { padding: 0 18px; margin-top: -30px; position: relative; z-index: 1; }
  .p-body h1 { font-size: 25px; line-height: 1.2; margin: 0; }
  .p-body .meta { color: var(--mute); margin-top: 6px; font-size: 14px; }
  .p-body .kick { display: flex; align-items: center; gap: 6px; color: var(--acc); font-size: 13px; font-weight: 650; margin-bottom: 6px; }
  .p-body .kick svg { width: 16px; height: 16px; }
  .p-body .duo { margin-top: 18px; }
  .rate-row { display: flex; align-items: center; justify-content: space-between; margin-top: 18px; font-size: 14px; }
  .rate-row .imdb { color: #f5c518; }
  .link { display: flex; align-items: center; justify-content: space-between; width: 100%; margin-top: 18px; padding: 14px 0; border-top: 1px solid var(--line); font-weight: 600; font-size: 14.5px; }
  .link svg { width: 20px; height: 20px; color: var(--mute); }
  .scrim { position: fixed; inset: 0; z-index: 70; background: rgba(0,0,0,.55); animation: fadein .2s; }
  @keyframes fadein { from { opacity: 0; } }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 71; background: var(--s1); border-radius: 22px 22px 0 0; padding: 10px 18px 22px; max-height: 78svh; overflow-y: auto; animation: up .24s cubic-bezier(.2,.9,.25,1); }
  @keyframes up { from { transform: translateY(100%); } }
  .sheet .grab { width: 38px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.18); margin: 0 auto 14px; }
  .sheet h3 { margin: 0 0 6px; font-size: 17px; }
  .sheet .hint { color: var(--mute); font-size: 13.5px; margin-bottom: 6px; }
  .opt { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 14px 2px; text-align: left; font-size: 15px; border-bottom: 1px solid var(--line); }
  .opt:last-child { border-bottom: 0; }
  .opt.on { color: var(--acc); font-weight: 650; }
  .opt svg { width: 20px; height: 20px; }
  .mrow { display: flex; align-items: center; gap: 14px; width: 100%; padding: 11px 2px; text-align: left; }
  .mrow i { width: 40px; height: 40px; border-radius: 50%; background: var(--s2); display: grid; place-items: center; flex: none; }
  .mrow i svg { width: 19px; height: 19px; }
  .mrow b { display: block; font-size: 15px; font-weight: 600; }
  .mrow span { font-size: 12.5px; color: var(--mute); }
  .stepper { display: flex; align-items: center; justify-content: center; gap: 22px; padding: 16px 0 6px; }
  .stepper button { width: 52px; height: 52px; border-radius: 50%; background: var(--s2); font-size: 24px; font-weight: 700; }
  .stepper b { min-width: 90px; text-align: center; font-size: 18px; }

  /* ---------- phone player ---------- */
  #pp { position: fixed; inset: 0; z-index: 60; background: #000; }
  #pp video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
  #pp .ov { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: space-between;
            background: linear-gradient(180deg, rgba(0,0,0,.65), transparent 22%, transparent 70%, rgba(0,0,0,.75)); transition: background .3s; }
  #pp .ov > * { transition: opacity .25s; }
  #pp.idle .ov { background: transparent; }
  #pp.idle .ov > * { opacity: 0; pointer-events: none; }
  #pp .top { display: flex; align-items: center; gap: 10px; padding: 16px 16px 0; }
  #pp .top .t { flex: 1; min-width: 0; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #pp .mid { display: flex; align-items: center; justify-content: center; gap: 40px; }
  #pp .mid button { width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; background: rgba(0,0,0,.4); }
  #pp .mid .big { width: 74px; height: 74px; }
  #pp .mid .big svg { width: 36px; height: 36px; }
  #pp .bot { padding: 0 16px 14px; }
  #pp .bot .row { display: flex; gap: 8px; align-items: center; justify-content: flex-end; margin-top: 6px; }
  #pp .bot .row .btn { height: 38px; font-size: 13px; background: rgba(255,255,255,.12); border-radius: 999px; }
  @media (orientation: landscape) {                       /* keep everything clear of a camera cutout on either side */
    #pp .top, #pp .bot { padding-left: max(56px, env(safe-area-inset-left)); padding-right: max(56px, env(safe-area-inset-right)); }
  }
  #pp .msg { position: absolute; left: 50%; top: 50%; transform: translate(-50%, 64px); background: rgba(0,0,0,.72); padding: 8px 16px; border-radius: 999px; font-size: 13px; pointer-events: none; white-space: nowrap; }
  #pp .spin { position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; margin: -22px; border-radius: 50%; border: 3px solid rgba(255,255,255,.2); border-top-color: #fff; animation: spin 1s linear infinite; pointer-events: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #pp .ripple { position: absolute; top: 50%; transform: translateY(-50%); padding: 10px 16px; border-radius: 999px; background: rgba(0,0,0,.55); font-weight: 700; pointer-events: none; animation: rip .6s ease forwards; }
  @keyframes rip { from { opacity: 1; } to { opacity: 0; } }
  #pp-next { position: absolute; right: 16px; bottom: 90px; width: min(300px, 70vw); padding: 14px; border-radius: 16px; background: rgba(20,19,24,.92); }
  #pp-next b { display: block; font-size: 14px; margin: 2px 0 10px; }
  #pp-next .duo .btn { height: 40px; font-size: 13.5px; }
  @media (orientation: landscape) { #pp-next { right: max(56px, env(safe-area-inset-right)); } }
  #pp video::cue { background: rgba(0,0,0,.55); }
  video::-internal-media-controls-overlay-cast-button { display: none; }

  #toast { position: fixed; left: 50%; bottom: calc(var(--tab-h) + 16px); transform: translate(-50%, 20px); opacity: 0; z-index: 90; background: #26232c;
           padding: 10px 18px; border-radius: 999px; font-weight: 600; font-size: 14px; transition: .25s; pointer-events: none; white-space: nowrap; max-width: 92vw; overflow: hidden; text-overflow: ellipsis; }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>

  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></symbol>
  <symbol id="i-prev" viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></symbol>
  <symbol id="i-fwd" viewBox="0 0 24 24"><path d="M12 5V2l5 4-5 4V7a6 6 0 1 0 6 6h2a8 8 0 1 1-8-8z"/></symbol>
  <symbol id="i-vol" viewBox="0 0 24 24"><path d="M4 9v6h4l5 5V4L8 9zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></symbol>
  <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9v6h4l5 5V4L8 9zm16.6 3 2.1-2.1-1.4-1.4-2.1 2.1-2.1-2.1-1.4 1.4 2.1 2.1-2.1 2.1 1.4 1.4 2.1-2.1 2.1 2.1 1.4-1.4z"/></symbol>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var APP = !!window.UltronApp;                          // inside the Android app (android/): it adds what a web page cannot do
  if (APP) document.documentElement.classList.add('in-app');
  var now = { kind: 'none' }, lastNowAt = 0, dragging = false, dragT = 0, volTouch = 0, pollT = null, fails = 0, tab = 'now';
  var LIB = { cards: null, cardsAt: 0, movies: [], series: [], cont: [], likes: new Set(), playlists: [], albums: [] };
  var stripCache = {}, seriesCache = {};
  function noop() {}

  // ---------------------------------------------------------------- helpers
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function icon(n) { return '<svg><use href="#i-' + n + '"/></svg>'; }
  function enc(s) { return encodeURIComponent(s); }
  function buzz() { try { navigator.vibrate && navigator.vibrate(8); } catch (e) {} }
  function toast(t) { var el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(function () { el.classList.remove('on'); }, 2000); }
  function fmt(s) { s = Math.max(0, Math.floor(s || 0)); var h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, x = s % 60;
    return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0'); }
  function left(s) { var m = Math.max(1, Math.round((s || 0) / 60)); return m >= 60 ? Math.floor(m / 60) + ' h ' + (m % 60) + ' min left' : m + ' min left'; }
  // images: lazy, through the PC; a backdrop that does not exist falls back to the poster
  function img(u, fb) { return u ? '<img loading="lazy" decoding="async" alt="" src="/x' + esc(u) + '"' + (fb ? ' data-fb="/x' + esc(fb) + '"' : '') + '>' : ''; }
  document.addEventListener('error', function (e) {
    var t = e.target; if (!t || t.tagName !== 'IMG') return;
    if (t.dataset.fb) { var f = t.dataset.fb; delete t.dataset.fb; t.src = f; } else t.classList.add('broken');
  }, true);
  function req(method, path, body) {
    var o = { method: method, credentials: 'same-origin', headers: {} };
    if (body !== undefined) { o.headers['Content-Type'] = 'application/json'; o.headers['X-Remote'] = '1'; o.body = JSON.stringify(body); }
    return fetch(path, o);
  }
  function getJ(path) { return req('GET', path).then(function (r) { if (r.status === 401) { showPair(); throw new Error('unpaired'); } if (!r.ok) throw new Error(r.status); return r.json(); }); }
  function postJ(path, body) { return req('POST', path, body).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }); }
  function cmd(c, arg) {
    return req('POST', '/cmd', { cmd: c, arg: arg }).then(function (r) {
      if (r.status === 401) showPair(); else setTimeout(poll, 250);
    }).catch(function () { toast("Can't reach your PC"); });
  }

  // ---------------------------------------------------------------- layers + the back button
  // Pages, sheets and the player stack up. The phone's back button closes the top one (browser: through one history entry
  // that is kept armed while anything is open or a tab other than Now is shown; app: MainActivity asks ultronBack()).
  var LAYERS = [], armed = false, skipPop = 0, disarmT = null;
  function needArm() { return LAYERS.length > 0 || tab !== 'now'; }
  function syncArm() {
    if (APP) return;
    clearTimeout(disarmT);
    if (needArm()) { if (!armed) { try { history.pushState({ zr: 1 }, ''); armed = true; } catch (e) {} } }
    else if (armed) disarmT = setTimeout(function () { if (!needArm() && armed) { armed = false; skipPop++; history.back(); } }, 80);
  }
  function openLayer(close) { LAYERS.push(close); syncArm(); }
  function closeTop() { var f = LAYERS.pop(); if (!f) return false; try { f(); } catch (e) {} syncArm(); return true; }
  window.addEventListener('popstate', function () {
    if (skipPop > 0) { skipPop--; return; }
    armed = false;
    if (LAYERS.length) { try { LAYERS.pop()(); } catch (e) {} } else if (tab !== 'now') showTab('now');
    syncArm();
  });
  window.ultronBack = function () {
    if (closeTop()) return true;
    if (tab !== 'now' && !$('app').classList.contains('hidden')) { go('now'); return true; }
    return false;
  };
  var curSheet = null;
  function sheet(title, html) {                          // one sheet at a time: a second one replaces the first's content
    if (!curSheet) {
      var s = document.createElement('div'); s.className = 'scrim';
      var d = document.createElement('div'); d.className = 'sheet';
      document.body.appendChild(s); document.body.appendChild(d);
      s.onclick = function () { closeTop(); };
      curSheet = { s: s, d: d };
      openLayer(function () { s.remove(); d.remove(); curSheet = null; });
    }
    curSheet.d.innerHTML = '<div class="grab"></div>' + (title ? '<h3>' + esc(title) + '</h3>' : '') + html;
    curSheet.d.onclick = null;
    curSheet.d.scrollTop = 0;
    return curSheet.d;
  }
  function options(title, list, pick, hint) {
    var d = sheet(title, (hint ? '<div class="hint">' + esc(hint) + '</div>' : '') + (list.length ? list.map(function (o, i) {
      return '<button class="opt' + (o.on ? ' on' : '') + '" data-i="' + i + '"><span>' + esc(o.label) + '</span>' + (o.on ? icon('check') : '') + '</button>';
    }).join('') : '<div class="empty">Nothing to choose here.</div>'));
    d.onclick = function (e) { var b = e.target.closest('.opt'); if (!b) return; buzz(); var v = list[+b.dataset.i].value; closeTop(); pick(v); };
  }
  function page(html, reuse) {
    var d = reuse && reuse.isConnected ? reuse : null;
    if (!d) {
      d = document.createElement('div'); d.className = 'page';
      $('layer').appendChild(d);
      openLayer(function () { d.remove(); });
    }
    d.innerHTML = '<button class="round back" aria-label="Back">' + icon('left') + '</button>' + html;
    d.querySelector('.back').onclick = function (e) { e.stopPropagation(); buzz(); closeTop(); };
    d.scrollTop = 0;
    return d;
  }

  // ---------------------------------------------------------------- pairing
  function showPair() { clearTimeout(pollT); $('app').classList.add('hidden'); $('tabs').classList.add('hidden'); $('pair').classList.remove('hidden'); $('dot').classList.remove('on'); }
  function pair(pin) {
    $('pair-err').textContent = '';
    return req('POST', '/pair', { pin: pin }).then(function (r) {
      return r.json().then(function (d) {
        if (r.ok) { history.replaceState(null, '', location.pathname); start(); }
        else { $('pair-err').textContent = d.error || 'Could not pair'; $('pin').value = ''; }
      });
    }).catch(function () { $('pair-err').textContent = "Can't reach your PC"; });
  }
  $('pin').addEventListener('input', function () { if (/^\d{6}$/.test(this.value)) pair(this.value); });

  // ---------------------------------------------------------------- tabs
  function showTab(t) {
    tab = t;
    [].forEach.call(document.querySelectorAll('nav.tabs button'), function (b) { b.classList.toggle('on', b.dataset.tab === t); });
    ['now', 'watch', 'music', 'search'].forEach(function (k) { $('v-' + k).classList.toggle('hidden', k !== t); });
    window.scrollTo(0, 0);
    if (t === 'watch') renderWatch();
    if (t === 'music') renderMusic();
    if (t === 'now') renderIdle();
    if (t === 'search') setTimeout(function () { $('q').focus(); }, 60);
  }
  function go(t) { while (LAYERS.length) { try { LAYERS.pop()(); } catch (e) {} } showTab(t); syncArm(); }
  [].forEach.call(document.querySelectorAll('nav.tabs button'), function (b) { b.onclick = function () { buzz(); go(b.dataset.tab); }; });

  // ---------------------------------------------------------------- library data
  function loadCards(force) {
    if (LIB.cards && !force && Date.now() - LIB.cardsAt < 300000) return Promise.resolve(LIB.cards);
    return getJ('/x/api/videos').then(function (d) {
      var seen = {}, movies = [];
      function add(c) { if (c && c.kind === 'video' && !seen[c.id]) { seen[c.id] = 1; movies.push(c); } }
      (d.loose || []).forEach(add);
      (d.collections || []).forEach(function (c) { (c.items || []).forEach(add); });
      (d.genres || []).forEach(function (g) { (g.items || []).forEach(add); });
      LIB.movies = movies; LIB.series = d.all_series || []; LIB.cards = d; LIB.cardsAt = Date.now();
      return d;
    });
  }
  function loadMusic() {
    return Promise.all([getJ('/x/api/playlists').catch(function () { return []; }), getJ('/x/api/music/albums').catch(function () { return { albums: [] }; }),
                        getJ('/x/api/likes').catch(function () { return { ids: [] }; })]).then(function (r) {
      LIB.playlists = Array.isArray(r[0]) ? r[0] : (r[0].playlists || []); LIB.albums = r[1].albums || []; LIB.likes = new Set(r[2].ids || []);
    });
  }
  var contAt = 0;
  function loadCont() {
    contAt = Date.now();
    return getJ('/library').then(function (d) { LIB.cont = d.continue || []; renderIdle(); }).catch(noop);
  }
  function findCard(id) { return LIB.movies.filter(function (c) { return c.id === id; })[0] || null; }

  // ---------------------------------------------------------------- NOW
  var lastHero = '';

  // scrub bar with preview pictures (one filmstrip per video, fetched once)
  function loadStrip(vid, dur) {
    vid = vid || now.vid; dur = dur || now.dur;
    if (!vid || !dur || stripCache[vid]) return;
    var im = new Image();
    stripCache[vid] = { img: im, n: 40, dur: dur, ok: false };
    im.onload = function () { stripCache[vid].ok = true; };
    im.src = '/x/api/videos/' + enc(vid) + '/strip?a=0&b=' + dur.toFixed(2) + '&n=40&w=160';
  }
  function showPreview(el, vid, t) {
    var s = stripCache[vid];
    if (!s || !s.ok) { el.classList.add('hidden'); return; }
    var i = Math.max(0, Math.min(s.n - 1, Math.floor(t / s.dur * s.n))), fw = s.img.naturalWidth / s.n, h = s.img.naturalHeight, k = 150 / fw;
    el.style.backgroundImage = 'url("' + s.img.src + '")';
    el.style.backgroundSize = (s.img.naturalWidth * k) + 'px ' + (h * k) + 'px';
    el.style.backgroundPosition = (-i * fw * k) + 'px 0';
    el.style.height = (h * k) + 'px';
    el.querySelector('b').textContent = fmt(t);
    el.classList.remove('hidden');

  function scrubber(bar, getDur, getVid, onSeek, preview, timeEl) {
    var drag = false;
    function frac(e) { var r = bar.getBoundingClientRect(); return Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)); }
    function move(e) {
      var f = frac(e), t = f * getDur(); setBar(bar, f); dragT = t; timeEl.textContent = fmt(t);
      if (preview) { preview.style.left = Math.max(12, Math.min(88, f * 100)) + '%'; showPreview(preview, getVid(), t); }
    }
    function end() { drag = false; dragging = false; bar.classList.remove('drag'); if (preview) preview.classList.add('hidden'); }
    bar.addEventListener('pointerdown', function (e) { if (!getDur()) return; drag = true; dragging = true; bar.classList.add('drag'); bar.setPointerCapture(e.pointerId); move(e); e.stopPropagation(); });
    bar.addEventListener('pointermove', function (e) { if (drag) move(e); });
    bar.addEventListener('pointerup', function (e) { if (!drag) return; end(); buzz(); onSeek(frac(e) * getDur()); });
    bar.addEventListener('pointercancel', end);

  // ---------------------------------------------------------------- sound on the phone (the picture stays on the PC)
  // Same soundtrack / song on the phone, following the PC's clock: small drift is fixed by playing a hair faster or slower,
  // a jump (seek, pause, next track) restarts it at the right second. "Sync" nudges it for Bluetooth delay (remembered).
  var SND = { on: false, el: new Audio(), key: '', base: 0, lead: 1.0, started: 0, piped: false, holdT: 0, lat: 0,
              offset: parseFloat(localStorage.getItem('zr-offset') || '0') || 0 };
  SND.el.preload = 'auto';
  try { SND.el.disableRemotePlayback = true; } catch (e) {}
  window.__snd = SND;
  function sndKey() { return now.kind === 'video' && now.vid ? 'v:' + now.vid : now.kind === 'music' && now.tid ? 't:' + now.tid : ''; }
  // where the phone's sound should be now: the PC's position, plus the phone's own output delay (what you hear left the
  // player a moment ago), plus your Sync nudge (+ = earlier sound, for Bluetooth delay)
  function sndTarget() { return curPos() + SND.lat + SND.offset; }

    try {
      var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      var ac = new AC();
      setTimeout(function () { try { var l = ac.outputLatency || ac.baseLatency || 0; if (l > 0 && l < 0.5) SND.lat = l; ac.close(); } catch (e) {} }, 400);
    } catch (e) {}
  }
  function sndNow() { return SND.base + (SND.el.currentTime || 0); }
  function sndStart(key, t) {
    SND.key = key;
    clearTimeout(SND.holdT); SND.holdT = 0;
    if (key.charAt(0) === 'v') {
      SND.piped = true; SND.base = t + SND.lead;
      SND.el.src = '/audio/' + enc(key.slice(2)) + '?t=' + SND.base.toFixed(2);
      SND.started = Date.now();
    } else {
      SND.piped = false; SND.base = 0;
      SND.el.src = '/song/' + enc(key.slice(2));
      SND.el.addEventListener('loadedmetadata', function once() { SND.el.removeEventListener('loadedmetadata', once); try { SND.el.currentTime = sndTarget(); } catch (e) {} });
    }
    if (!now.paused) SND.el.play().catch(noop);
  }
  SND.el.addEventListener('playing', function () {
    if (SND.piped && SND.started) { var late = sndTarget() - sndNow(); SND.lead = Math.max(0.2, Math.min(3, SND.lead + late)); SND.started = 0; }
  });
  SND.el.addEventListener('error', function () { if (SND.on && SND.el.getAttribute('src')) { toast("The phone can't play this sound"); soundOff(); } });
  function soundSync() {
    if (!SND.on) return;
    var key = sndKey();
    if (!key) {
      SND.el.pause();
      if (now.kind === 'video' && now.private) { toast('Private videos keep their sound on the PC'); soundOff(); }
      return;
    }
    if (key !== SND.key) { cmd('pc_mute', true); sndStart(key, sndTarget()); return; }   // a new video window on the PC: keep it quiet
    if (now.paused) { clearTimeout(SND.holdT); SND.holdT = 0; if (!SND.el.paused) SND.el.pause(); return; }
    if (SND.holdT) return;                               // holding back on purpose (see below)
    if (SND.el.paused && SND.el.readyState >= 2) SND.el.play().catch(noop);
    if (SND.el.readyState < 2 || SND.el.paused) return;
    var drift = sndNow() - sndTarget(), sp = now.speed || 1;
    if (!SND.piped) {                                    // a song file: just jump to the right spot
      if (Math.abs(drift) > 0.12) { SND.el.currentTime = sndTarget(); SND.el.playbackRate = sp; return; }
    } else if (drift > 0.08 && drift < 4) {              // ahead: hold the sound back for exactly that long
      SND.el.pause(); SND.el.playbackRate = sp;
      SND.holdT = setTimeout(function () { SND.holdT = 0; if (SND.on && !now.paused) SND.el.play().catch(noop); }, drift * 1000);
      return;
    } else if (drift < -0.6 || drift >= 4) {            // far behind (or lost): start again at the right second
      sndStart(key, sndTarget()); return;
    }
    // small differences: play a hair faster or slower until it lines up
    SND.el.playbackRate = Math.abs(drift) > 0.02 ? sp * Math.max(0.92, Math.min(1.08, 1 - drift * 0.8)) : sp;
  }
  setInterval(soundSync, 400);
  function paintEar() { $('ear-txt').textContent = 'Sound is on this phone' + (SND.offset ? ' (' + (SND.offset > 0 ? '+' : '') + SND.offset.toFixed(1) + ' s)' : ''); $('tools').dataset.k = ''; paint(); }
  function soundOn() {
    var key = sndKey();
    if (!key) { toast(now.private ? 'Private videos keep their sound on the PC' : 'Play something on the PC first'); return; }
    SND.on = true;
    measureLatency();
    sndStart(key, sndTarget());                          // started inside this tap: phones only allow sound after a tap
    cmd('pc_mute', true);
    if (APP && UltronApp.localAudio) UltronApp.localAudio(true);

  };
  // tap = show / hide the controls; double-tap the left or right half = 10 s back / forward
  var tapT = null, lastTap = 0;
  $('pp-ov').addEventListener('click', function (e) {
    if (e.target.closest('button') || e.target.closest('.bar')) return;
    var t = Date.now(), side = e.clientX < window.innerWidth / 2 ? -1 : 1;
    if (t - lastTap < 300) {
      clearTimeout(tapT); lastTap = 0; buzz(); seekTo(pTime() + side * 10);
      var r = document.createElement('div'); r.className = 'ripple'; r.textContent = side < 0 ? '−10 s' : '+10 s';
      r.style[side < 0 ? 'left' : 'right'] = '18%'; $('pp').appendChild(r); setTimeout(function () { r.remove(); }, 650);
      return;
    }
    lastTap = t;
    tapT = setTimeout(function () { if ($('pp').classList.contains('idle')) poke(); else if (!V.paused) $('pp').classList.add('idle'); }, 260);
  });
  function poke() { $('pp').classList.remove('idle'); clearTimeout(P.hideT); P.hideT = setTimeout(function () { if (!V.paused && !dragging) $('pp').classList.add('idle'); }, 3500); }
  // subtitles are added as cues shifted by the stream offset, so they stay in sync after a seek in a converted stream
  function applySubs() {
    var tt = V.__track || (V.__track = V.addTextTrack('subtitles', 'Subtitles', 'en'));
    tt.mode = 'hidden';
    while (tt.cues && tt.cues.length) tt.removeCue(tt.cues[0]);
    if (P.sub < 0) return;
    var i = P.sub;
    (P.cues[i] ? Promise.resolve(P.cues[i]) : req('GET', '/x' + P.subs[i].url).then(function (r) { return r.text(); }).then(function (txt) { return (P.cues[i] = parseVtt(txt)); })).then(function (cues) {
      if (P.sub !== i) return;
      cues.forEach(function (c) { var s = c[0] - P.offset, e = c[1] - P.offset; if (e > 0) { try { tt.addCue(new VTTCue(Math.max(0, s), e, c[2])); } catch (er) {} } });
      tt.mode = 'showing';
    }).catch(function () { toast('Could not load the subtitles'); });
  }
  function parseVtt(txt) {
    var out = [], re = /(\d+:)?(\d{1,2}):(\d{2})[.,](\d{3})\s*-->\s*(\d+:)?(\d{1,2}):(\d{2})[.,](\d{3})[^\n]*\n([\s\S]*?)(?:\n\s*\n|$)/g, m;
    function sec(h, mi, s, ms) { return (h ? parseInt(h, 10) * 3600 : 0) + parseInt(mi, 10) * 60 + parseInt(s, 10) + parseInt(ms, 10) / 1000; }
    txt = txt.replace(/\r/g, '');
    while ((m = re.exec(txt))) out.push([sec(m[1], m[2], m[3], m[4]), sec(m[5], m[6], m[7], m[8]), m[9].replace(/<[^>]+>/g, '').trim()]);
    return out;
  }
  function goFullscreen(force) {
    if (APP) { UltronApp.immersive(true); return; }      // the app hides the system bars (clear of the camera) and turns sideways
    var el = $('pp');
    try {
      var p = (el.requestFullscreen || el.webkitRequestFullscreen || function () { return Promise.reject(); }).call(el);
      Promise.resolve(p).then(function () { try { screen.orientation.lock('landscape').catch(noop); } catch (e) {} }).catch(function () {
        if (force && V.webkitEnterFullscreen) V.webkitEnterFullscreen();
      });
    } catch (e) {}
  }
  function closePlayer() {
    saveProgress();
    hideNextCard();
    P.vid = null; V.pause(); V.removeAttribute('src'); V.load();
    $('pp').classList.add('hidden');
    if (APP) { UltronApp.immersive(false); UltronApp.local(false); }
    try { if (document.fullscreenElement) document.exitFullscreen(); screen.orientation.unlock(); } catch (e) {}
    setTimeout(loadCont, 700);
  }

  // ---------------------------------------------------------------- header, app, start
  $('b-appfs').onclick = function () {
    buzz();
    var d = document.documentElement;
    if (document.fullscreenElement) document.exitFullscreen().catch(noop);
    else (d.requestFullscreen || d.webkitRequestFullscreen || noop).call(d);
  };
  if (APP) {
    $('b-menu').classList.remove('hidden');
    $('b-menu').onclick = function () { buzz(); options('ULTRON Remote ' + UltronApp.version(), [{ label: 'Switch to another PC', on: false, value: 'pc' }], function (v) { if (v === 'pc') UltronApp.changePc(); }); };
  } else if (/Android/i.test(navigator.userAgent)) {
    fetch('/app.apk', { method: 'HEAD', credentials: 'same-origin' }).then(function (r) { if (r.ok) $('b-getapp').classList.remove('hidden'); }).catch(noop);
    $('b-getapp').addEventListener('click', function () { toast('Downloading the app. Open it to install.'); });
  }
  document.addEventListener('visibilitychange', function () { if (!document.hidden) poll(); else if (P.vid) saveProgress(); });
  window.addEventListener('pagehide', function () { if (P.vid) saveProgress(); });

  function start() { $('pair').classList.add('hidden'); $('app').classList.remove('hidden'); $('tabs').classList.remove('hidden'); poll(); loadCont(); loadCards().catch(noop); }
  var m = /pin=(\d{6})/.exec(location.hash || '');
  req('GET', '/state').then(function (r) {
    if (r.ok) { history.replaceState(null, '', location.pathname); start(); }
    else if (m) pair(m[1]);
    else showPair();
  }).catch(function () { showPair(); $('pair-err').textContent = "Can't reach your PC"; });
})();
</script>
